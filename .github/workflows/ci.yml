name: CI

on:
  push:
    branches: [main, feature/yemeni-smart-teacher, feat/complete-supabase-production]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (PHP 8.4 + PostgreSQL)
    runs-on: ubuntu-latest

    # PostgreSQL mirrors production (Supabase is managed PostgreSQL), so the
    # migrations and seeders are exercised on the same engine they run on.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school_secret
          POSTGRES_DB: teacher_safwat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, gd, intl, zip, xml, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: teacher_safwat_test
          DB_USERNAME: school
          DB_PASSWORD: school_secret
          DB_SSLMODE: prefer
        run: php artisan test

  web:
    name: Web assets (JS syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check front-end scripts
        run: |
          node --check web/assets/app.js
          node --check web/assets/api.js
          node --check web/assets/config.js
          node --check web/assets/offline.js
          node --check web/sw.js
