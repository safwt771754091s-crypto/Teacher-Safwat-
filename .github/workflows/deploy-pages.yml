name: Deploy web to GitHub Pages

# Publishes the static web app (web/) to the gh-pages branch, which GitHub
# Pages serves at https://safwt771754091s-crypto.github.io/Teacher-Safwat-/.
# Without this, deploying meant mirroring web/ into a gh-pages worktree by hand.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish web/ to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Publish web/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          commit_message: 'deploy(web): publish web/ from main'
