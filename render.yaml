# Render blueprint for the Yemeni Smart Teacher API.
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo.
# The static web app is served separately from GitHub Pages and points at the
# service URL below via web/assets/config.js (PROD_API_ORIGIN).
services:
  - type: web
    name: yemeni-smart-teacher-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: PLATFORM_OWNER
        value: المعلم صفوت
      # APP_KEY is generated by docker/entrypoint.sh when unset (must be base64:).
